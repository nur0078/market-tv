name: Build & deploy board

# Refreshes official RBA / Fed data and the economic calendar every 30 minutes,
# then publishes index.html + data/*.json to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RBA, Fed and calendar data
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir -p site/data
          python3 scripts/fetch_data.py --out site/data --prev "https://${OWNER}.github.io/${REPO}/data"
      - name: Assemble site
        run: cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
